<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard Login | Priya Collection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: #f7f5f0;
            display: flex;
            align-items: center;
            font-family: "Poppins", sans-serif;
            letter-spacing: 0;
        }

        h1, .brand {
            font-family: "Playfair Display", serif;
            letter-spacing: 0;
        }

        .login-card {
            background: #fff;
            border: 1px solid #e8dfcf;
            border-radius: 8px;
            box-shadow: 0 10px 26px rgba(31, 35, 40, .08);
        }

        .gold-btn {
            background: #b8860b;
            border-color: #b8860b;
            color: #fff;
            font-weight: 600;
        }

        .gold-btn:hover {
            background: #9d7108;
            border-color: #9d7108;
            color: #fff;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="login-card p-4 p-lg-5">
                    <div class="text-center mb-4">
                        <div class="brand h3">PRIYA COLLECTION</div>
                        <p class="text-muted mb-0">Staff Dashboard Login</p>
                    </div>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input class="form-control" type="text" name="username" autocomplete="username" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input class="form-control" type="password" name="password" autocomplete="current-password" required>
                        </div>
                        <button class="btn gold-btn w-100" type="submit">Login</button>
                    </form>
                    <a class="d-block text-center mt-3" href="{% url 'home' %}">Back to store</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
