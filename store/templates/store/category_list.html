{% extends 'store/base.html' %}

{% block title %}Categories | Priya Collection{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="section-title mt-0">
        <h1>Shop by Category</h1>
        <div class="title-line"></div>
    </div>

    <div class="row g-4 justify-content-center">
        {% for category in categories %}
            <div class="col-sm-6 col-lg-3">
                <a class="category-card" href="{% url 'category_products' category.id category.slug|default:'jewellery' %}">
                    <span>
                        <i class="bi bi-stars"></i>
                        {{ category.name }}
                    </span>
                </a>
            </div>
        {% empty %}
            <div class="col-12">
                <div class="content-shell p-5 text-center">
                    <h3>No categories yet</h3>
                    <p class="text-muted mb-0">Create categories from the dashboard.</p>
                </div>
            </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
