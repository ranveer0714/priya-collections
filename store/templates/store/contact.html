{% extends 'store/base.html' %}

{% block title %}Contact | Priya Collection{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="content-shell p-4 h-100">
                <h1>Contact</h1>
                <div class="title-line ms-0 mb-4"></div>
                <p class="text-muted">For product questions, order help, or custom jewellery requests, reach out to Priya Collection.</p>
                <div class="d-flex gap-3 mb-3"><i class="bi bi-envelope trust-icon"></i><span>support@priyacollection.local</span></div>
                <div class="d-flex gap-3 mb-3"><i class="bi bi-telephone trust-icon"></i><span>+91 98765 43210</span></div>
                <div class="d-flex gap-3"><i class="bi bi-geo-alt trust-icon"></i><span>India</span></div>
            </div>
        </div>
        <div class="col-lg-7">
            <div class="content-shell p-4">
                <form>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Name</label>
                            <input class="form-control" type="text" placeholder="Your name">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input class="form-control" type="email" placeholder="Your email">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" rows="5" placeholder="How can we help?"></textarea>
                        </div>
                        <div class="col-12">
                            <button class="btn gold-btn" type="button">Send Message</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
